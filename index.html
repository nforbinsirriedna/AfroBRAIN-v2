<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AfroBRAIN - Edna</title><style>body{margin:0;background:#0e0f14;color:#e6e8ef;font-family:sans-serif}header{padding:20px}h1 span{color:#6ee7b7}.card{background:#171923;border:1px solid #2a2d3a;border-radius:16px;padding:16px;margin:16px}canvas{width:100%;height:140px;background:#0a0b10;border-radius:10px}button{padding:8px 12px;border-radius:20px;margin:4px}</style></head><body><header><h1>AfroBRAIN <span>v2</span></h1><div>Edna Nforbin, 13, Bamenda</div></header><div class="card"><canvas id="eeg"></canvas><div><button onclick="setState('rest')">Rest</button><button onclick="setState('focus')">Focus</button></div></div><script>let state='rest',t=0;const c=document.getElementById('eeg'),x=c.getContext('2d');function setState(s){state=s}function draw(){t+=0.02;c.width=c.clientWidth*2;c.height=280;x.clearRect(0,0,c.width,c.height);x.strokeStyle='#6ee7b7';x.lineWidth=3;x.beginPath();for(let i=0;i<c.width;i++){let f=state=='rest'?10:18;let a=state=='rest'?50:25;let y=c.height/2+Math.sin(i/40+t*f)*a;if(i==0)x.moveTo(i,y);else x.lineTo(i,y)}x.stroke();requestAnimationFrame(draw)}draw();</script></body></html>
