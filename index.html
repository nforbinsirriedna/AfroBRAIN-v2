<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AfroBRAIN v2</title><style>body{margin:0;background:#0f0b1f;color:white;font-family:Arial;text-align:center}h1{color:#b47aff;margin:10px 0}.card{background:#1e1540;border-radius:16px;padding:16px;margin:12px;border:1px solid #3a2a7a}button{background:#b47aff;color:white;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;margin:4px}button.gold{background:#FFD700;color:#1e1540}#eeg{width:100%;height:80px;background:#120e2b;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.tile{background:#2a1e5a;border-radius:10px;height:60px;display:flex;align-items:center;justify-content:center;font-size:24px}.hidden{display:none}</style></head><body>
<div id="home"><h1>AfroBRAIN</h1><p>Train Your Brain - Neuroscience for African Youth</p>
<div class="card"><button onclick="show('focus')">Focus Timer</button><button onclick="show('memory')">Memory Game</button><button onclick="show('eeg')">EEG Simulator</button></div>
<p style="font-size:12px;opacity:0.6">Made for hospitals - Offline PWA - Works on iPhone & Android</p></div>

<div id="focus" class="hidden"><h1>Focus Timer</h1><div class="card"><h2 id="timer">25:00</h2><p>Focus Session</p><button class="gold" onclick="startTimer()">START</button><button onclick="show('home')">BACK</button></div></div>

<div id="memory" class="hidden"><h1>Memory Game</h1><div class="card"><div class="grid" id="grid"></div><button onclick="resetMemory()">RESET GAME</button><button onclick="show('home')">BACK</button></div></div>

<div id="eeg" class="hidden"><div style="display:block"><h1>EEG Simulator</h1><div class="card"><p>Headband: Connected (Simulated) - 1-40Hz Filter</p><canvas id="wave" width="300" height="80"></canvas><br><button class="gold" onclick="startEEG()">START SIMULATION</button><button onclick="show('home')">BACK</button></div></div></div>

<script>
function show(id){['home','focus','memory','eeg'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id=='memory')resetMemory();}
let t=1500,iv=null;function startTimer(){if(iv)return;iv=setInterval(()=>{t--;let m=Math.floor(t/60),s=t%60;document.getElementById('timer').innerText=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;if(t<=0){clearInterval(iv);iv=null;alert('Focus done!');t=1500;}},1000);}
function resetMemory(){let g=document.getElementById('grid');g.innerHTML='';let icons=['⭐','🧠','⚡','🔮'];let arr=[...icons,...icons].sort(()=>Math.random()-0.5);arr.forEach(i=>{let d=document.createElement('div');d.className='tile';d.innerText='?';d.onclick=()=>d.innerText=i;g.appendChild(d);});}
let ctx=document.getElementById('wave').getContext('2d'),eegRun=false;function startEEG(){eegRun=!eegRun;if(!eegRun)return;let x=0;function draw(){if(!eegRun)return;ctx.clearRect(0,0,300,80);ctx.strokeStyle='#b47aff';ctx.beginPath();for(let i=0;i<300;i++){let y=40+Math.sin((i+x)/15)*20*Math.random();if(i==0)ctx.moveTo(i,y);else ctx.lineTo(i,y);}ctx.stroke();x+=2;requestAnimationFrame(draw);}draw();}
</script></body></html>
