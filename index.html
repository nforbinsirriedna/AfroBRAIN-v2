<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfroBRAIN v2</title>
<link rel="manifest" href="manifest.json">
</head>
<body style="background:#111;color:#fff;text-align:center;padding:30px;font-family:Arial">
<h1>AfroBRAIN v2</h1>
<p>Tap Play to start</p>
<button onclick="startGame()" style="background:gold;padding:15px 30px;border:none;border-radius:10px;font-size:18px;font-weight:bold">PLAY</button>
<div id="gameArea" style="margin-top:20px"></div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
function startGame(){
 document.getElementById('gameArea').innerHTML='<h2>Game Started!</h2><p>Your AfroBRAIN puzzle loads here</p>';
}
</script>
</body>
</html>
