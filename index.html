<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AfroBRAIN v2</title><style>body{margin:0;background:#0c0a1a;color:#fff;font-family:Arial;text-align:center}#wrap{max-width:400px;margin:0 auto;padding:10px}.card{background:#1a1633;border:1px solid #2e285a;border-radius:20px;padding:16px;margin:10px}h1{color:#FFD700}.squares{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.sq{background:#231d4d;border:1px solid #b47aff;border-radius:16px;padding:18px 10px;cursor:pointer}.sq b{display:block;margin-top:6px;color:#FFD700}.hidden{display:none}#timerRing{width:150px;height:150px;border:3px solid #b47aff;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:36px;color:#FFD700}canvas{width:100%;height:90px;background:#0f0d24;border-radius:10px}.grid2{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tile{height:50px;background:#231d4d;border-radius:10px;display:flex;align-items:center;justify-content:center}button{background:#FFD700;color:#000;border:none;padding:12px 18px;border-radius:20px;font-weight:bold}</style></head><body><div id="wrap">
<div id="home"><div class="card"><div style="font-size:48px">🧠</div><h1>AfroBRAIN</h1><p style="color:#b47aff">Train Your Brain</p><div class="squares"><div class="sq" onclick="go('focus')">⏱️<b>Focus Timer</b><span style="font-size:11px;opacity:.7">Stay focused 25min</span></div><div class="sq" onclick="go('memory')">🧠<b>Memory Game</b><span style="font-size:11px;opacity:.7">Match pairs</span></div><div class="sq" onclick="go('eeg')">〰️<b>EEG Simulator</b><span style="font-size:11px;opacity:.7">Live waves</span></div><div class="sq" style="opacity:.5">📊<b>Stats</b><span style="font-size:11px">Coming</span></div></div><p style="font-size:10px;opacity:.5">Offline • iPhone & Android • No flag</p></div></div>
<div id="focus" class="hidden"><div class="card"><h2>Focus Timer</h2><div id="timerRing">25:00</div><button onclick="toggleTimer()" id="pBtn">START</button> <button onclick="go('home')" style="background:transparent;color:#b47aff">BACK</button></div></div>
<div id="memory" class="hidden"><div class="card"><h2>Memory Game - <span id="sc">0</span></h2><div class="grid2" id="mg"></div><button onclick="resetM()" style="margin-top:10px">RESET</button><br><button onclick="go('home')" style="background:transparent;color:#b47aff">BACK</button></div></div>
<div id="eeg" class="hidden"><div class="card"><h2>EEG Simulator • LIVE</h2><canvas id="w" width="300" height="90"></canvas><button onclick="toggleE()" id="eB">START</button><br><button onclick="go('home')" style="background:transparent;color:#b47aff">BACK</button></div></div>
</div><script>function go(id){['home','focus','memory','eeg'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id=='memory')resetM();}let rem=1500,ti=null,pa=false;function toggleTimer(){if(!ti){ti=setInterval(()=>{if(pa)return;rem--;let m=Math.floor(rem/60),s=rem%60;document.getElementById('timerRing').innerText=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;if(rem<=0){clearInterval(ti);ti=null;rem=1500;}},1000);}else{pa=!pa;document.getElementById('pBtn').innerText=pa?'RESUME':'PAUSE';}}let sc=0,f=null,lk=false;function resetM(){sc=0;document.getElementById('sc').innerText=sc;let icons=['⭐','🧠','⚡','🔮','💜','🎯'];let arr=[...icons,...icons].sort(()=>Math.random()-.5);let g=document.getElementById('mg');g.innerHTML='';arr.forEach(ic=>{let d=document.createElement('div');d.className='tile';d.dataset.ic=ic;d.innerText='?';d.onclick=()=>{if(lk||d.style.background=='gold')return;d.innerText=ic;if(!f){f=d;}else{if(f.dataset.ic==d.dataset.ic&&f!=d){f.style.background='gold';d.style.background='gold';sc+=20;document.getElementById('sc').innerText=sc;f=null;}else{lk=true;setTimeout(()=>{f.innerText='?';d.innerText='?';f=null;lk=false;},500);}}};g.appendChild(d);});}let on=false,ph=0,an=null;let cv=document.getElementById('w'),cx=cv.getContext('2d');function toggleE(){on=!on;document.getElementById('eB').innerText=on?'PAUSE':'START';if(on)draw();else cancelAnimationFrame(an);}function draw(){cx.clearRect(0,0,300,90);cx.strokeStyle='#b47aff';cx.beginPath();for(let x=0;x<300;x++){let y=45+Math.sin((x+ph)/12)*15;if(x==0)cx.moveTo(x,y);else cx.lineTo(x,y);}cx.stroke();ph+=2;an=requestAnimationFrame(draw);}resetM();</script></body></html>
